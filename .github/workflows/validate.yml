# ---------------------------------------------------------------------------
# CHECK AUTOMÁTICO (pode ignorar).
# Isto NÃO afeta quem usa a memória. O usuário roda o servidor MCP na própria
# máquina, numa pasta local ou na nuvem — nada disso passa pelo GitHub.
# Este arquivo só pede aos servidores do GitHub que rodem os testes e o
# validador (validate.py) quando VOCÊ sobe código novo, avisando se algo
# quebrou. É gratuito em repositórios públicos. Para checar sua memória na
# mão a qualquer momento: rode `python validate.py` na pasta do vault.
# ---------------------------------------------------------------------------
name: Validate vault

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MCP server (with dev deps)
        run: pip install -e "mcp-server[dev]"

      - name: Run server tests
        run: python -m pytest -q mcp-server/tests/

      - name: Validate OKF conformance + graph integrity
        run: python validate.py .
